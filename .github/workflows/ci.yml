# 백엔드 CI (08-infrastructure §4)
#   모든 push·PR: 빌드 + 단위 테스트 + 통합 테스트 (PostGIS 서비스 컨테이너, MASHIL_TEST_DB)
#   main push: 이미지 3개(api·worker·migrate)를 GHCR 에 올림. 태그 = git sha + latest. 인증은 GITHUB_TOKEN 만.
#     api 이미지에는 웹(Mashil-Front main)의 vite build 를 wwwroot 로 담는다 (한 도메인에서 웹 + API).
#   배포 (Azure Container Apps, docs/AZURE.md): 저장소 변수 AZURE_DEPLOY=true 일 때만
#     main push 또는 repository_dispatch(web-updated) → 개발 서버 (toilets-dev.ironhiro.dev)
#     수동 실행(workflow_dispatch, target=prod) → 운영 (toilets.ironhiro.dev)
#     순서: 마이그레이션 Job → API → Worker → 헬스체크. 자격 증명은 시크릿 AZURE_CREDENTIALS (서비스 주체)
# VM 구성을 쓸 때는 서버에서 deploy/deploy.sh <sha> (docs/OPERATIONS.md).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # 웹(Mashil-Front) main 이 바뀌면 웹 CI 가 보낸다 → api 이미지를 다시 만들어 개발 서버에
  repository_dispatch:
    types: [web-updated]
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상 (none: 이미지만)"
        type: choice
        options: [none, dev, prod]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mashil
          # 이 실행 안에서만 뜨는 일회용 DB라 비밀번호 없이 접속한다 (trust). 저장소에 비밀번호 문자열을 두지 않는다
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mashil -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # 통합 테스트가 테스트마다 임시 DB 를 만들고 지운다 (tests/Mashil.Import.IntegrationTests/TestDatabase.cs)
      MASHIL_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=mashil
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Mashil.slnx

      - name: Build
        run: dotnet build Mashil.slnx -c Release --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/Mashil.Import.Tests -c Release --no-build --logger "trx;LogFileName=unit-import.trx" --results-directory TestResults
          dotnet test tests/Mashil.Api.Tests -c Release --no-build --logger "trx;LogFileName=unit-api.trx" --results-directory TestResults

      - name: Integration tests (PostGIS)
        run: dotnet test tests/Mashil.Import.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14

  images:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v5

      # GHCR 이미지 이름은 소문자여야 한다
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mashil-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      # api 이미지에만: 웹을 빌드해 web-dist/ 에 (Dockerfile 이 wwwroot 로 복사)
      - name: Checkout web
        if: matrix.target == 'api'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Mashil-Front
          ref: main
          path: web-src
      - uses: actions/setup-node@v4
        if: matrix.target == 'api'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: Build web into web-dist
        if: matrix.target == 'api'
        working-directory: web-src
        env:
          VITE_KAKAO_MAP_KEY: ${{ vars.VITE_KAKAO_MAP_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_RELEASE: ${{ github.sha }}
        run: |
          npm ci
          npx vite build --outDir "$GITHUB_WORKSPACE/web-dist" --emptyOutDir
          touch "$GITHUB_WORKSPACE/web-dist/.keep"
          test -f "$GITHUB_WORKSPACE/web-dist/index.html"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Azure Container Apps 배포 (docs/AZURE.md). 저장소 변수 AZURE_DEPLOY=true, AZURE_RESOURCE_GROUP, 시크릿 AZURE_CREDENTIALS
  deploy:
    needs: images
    if: >-
      vars.AZURE_DEPLOY == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'repository_dispatch' ||
       (github.event_name == 'workflow_dispatch' && inputs.target != 'none'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 운영은 GitHub 환경 보호 규칙(승인자)을 걸 수 있게 environment 를 나눈다
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'prod') && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'prod') && 'prod' || 'dev' }}
      cancel-in-progress: false
    env:
      SUFFIX: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'prod') && '' || '-dev' }}
      HOST: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'prod') && 'toilets.ironhiro.dev' || 'toilets-dev.ironhiro.dev' }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Migrate, then swap API and Worker images
        run: |
          set -euo pipefail
          REG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          SHA="${GITHUB_SHA}"
          echo "대상: mashil-*${SUFFIX} (${HOST}), 이미지 ${SHA::7}"

          # 1) 마이그레이션 (expand/contract 규칙: 새 스키마는 직전 API 와도 호환, OPS-03)
          az containerapp job update -n "mashil-migrate${SUFFIX}" -g "$RG" --image "$REG/mashil-migrate:$SHA" -o none
          EXEC=$(az containerapp job start -n "mashil-migrate${SUFFIX}" -g "$RG" --query name -o tsv)
          for i in $(seq 1 60); do
            ST=$(az containerapp job execution show -n "mashil-migrate${SUFFIX}" -g "$RG" --job-execution-name "$EXEC" --query properties.status -o tsv)
            [ "$ST" = "Succeeded" ] && break
            if [ "$ST" = "Failed" ]; then echo "::error::마이그레이션 실패 ($EXEC)"; exit 1; fi
            sleep 10
          done
          [ "$ST" = "Succeeded" ] || { echo "::error::마이그레이션 시간 초과 ($EXEC)"; exit 1; }

          # 2) API (새 리비전이 준비되면 트래픽이 넘어간다) → 3) Worker
          az containerapp update -n "mashil-api${SUFFIX}" -g "$RG" --image "$REG/mashil-api:$SHA" -o none
          az containerapp update -n "mashil-worker${SUFFIX}" -g "$RG" --image "$REG/mashil-worker:$SHA" -o none

      - name: Smoke test
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "https://${HOST}/healthz/ready" >/dev/null
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://${HOST}/api/app/status" >/dev/null
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "https://${HOST}/"
