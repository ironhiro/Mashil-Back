# 백엔드 CI (08-infrastructure §4)
#   모든 push·PR: 빌드 + 단위 테스트 + 통합 테스트 (PostGIS 서비스 컨테이너, MASHIL_TEST_DB)
#   main push: 이미지 4개(api·worker·migrate·osmimport)를 GHCR 에 올림. 태그 = git sha + latest. 인증은 GITHUB_TOKEN 만.
#     api 이미지에는 웹(Mashil-Front main)의 vite build 를 wwwroot 로 담는다 (한 도메인에서 웹 + API).
#   배포 (Azure Container Apps, docs/AZURE.md, docs/RELEASE.md): 저장소 변수 AZURE_DEPLOY=true 일 때만
#     main push 또는 repository_dispatch(web-updated) → 개발 서버 (toilets-dev.ironhiro.dev)
#     태그 v2026.11.17 (같은 날 두 번째면 v2026.11.17.2) push → 운영 (toilets.ironhiro.dev)
#       운영은 새로 빌드하지 않는다: 개발에 지금 떠 있는 이미지(= 개발에서 확인한 그것)에 태그를 붙여 그대로 올린다.
#       태그 커밋과 개발 서버의 커밋이 다르면 멈춘다. 태그는 tools/release.sh 로 만든다.
#     순서: 마이그레이션 Job → API → Worker → 점검(새 리비전·커밋 확인). 점검 실패면 직전 이미지로 자동 되돌림
#     (deploy/azure/ci-deploy.sh). 자격 증명은 시크릿 AZURE_CREDENTIALS (서비스 주체)
# VM 구성을 쓸 때는 서버에서 deploy/deploy.sh <sha> (docs/OPERATIONS.md).
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # 웹(Mashil-Front) main 이 바뀌면 웹 CI 가 보낸다 → api 이미지를 다시 만들어 개발 서버에
  repository_dispatch:
    types: [web-updated]
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상 (none: 이미지만). 운영은 태그로 (docs/RELEASE.md)"
        type: choice
        options: [none, dev]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    # 태그(운영 승격)는 이미 main 에서 시험한 커밋이라 다시 돌리지 않는다
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mashil
          # 이 실행 안에서만 뜨는 일회용 DB라 비밀번호 없이 접속한다 (trust). 저장소에 비밀번호 문자열을 두지 않는다
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mashil -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # 통합 테스트가 테스트마다 임시 DB 를 만들고 지운다 (tests/Mashil.Import.IntegrationTests/TestDatabase.cs)
      MASHIL_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=mashil
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Mashil.slnx

      - name: Build
        run: dotnet build Mashil.slnx -c Release --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/Mashil.Import.Tests -c Release --no-build --logger "trx;LogFileName=unit-import.trx" --results-directory TestResults
          dotnet test tests/Mashil.Api.Tests -c Release --no-build --logger "trx;LogFileName=unit-api.trx" --results-directory TestResults

      - name: Integration tests (PostGIS)
        run: dotnet test tests/Mashil.Import.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14

  images:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [api, worker, migrate, osmimport]
    steps:
      - uses: actions/checkout@v5

      # GHCR 이미지 이름은 소문자여야 한다
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mashil-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      # api 이미지에만: 웹을 빌드해 web-dist/ 에 (Dockerfile 이 wwwroot 로 복사)
      - name: Checkout web
        if: matrix.target == 'api'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Mashil-Front
          ref: main
          path: web-src
      - uses: actions/setup-node@v4
        if: matrix.target == 'api'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: Build web into web-dist
        if: matrix.target == 'api'
        working-directory: web-src
        env:
          VITE_KAKAO_MAP_KEY: ${{ vars.VITE_KAKAO_MAP_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Sentry environment 는 웹이 접속 호스트로 정한다 (Mashil-Front src/lib/sentryEnv.ts): 같은 이미지가 dev → 운영으로 승격되므로
          VITE_RELEASE: ${{ github.sha }}
        run: |
          npm ci
          npx vite build --outDir "$GITHUB_WORKSPACE/web-dist" --emptyOutDir
          touch "$GITHUB_WORKSPACE/web-dist/.keep"
          # 어떤 웹 커밋이 들어갔는지 (배포 점검과 사람이 /version.json 으로 확인)
          printf '{"web":"%s"}\n' "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/web-dist/version.json"
          test -f "$GITHUB_WORKSPACE/web-dist/index.html"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          # sha-run_id: 실행마다 다른 태그. 웹만 바뀌어 백엔드 커밋이 같아도 배포가 새 이미지를 가리키게 한다
          # (같은 태그로 update 하면 Container Apps 는 바뀐 게 없다고 보고 새 리비전을 만들지 않는다)
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:${{ github.sha }}-${{ github.run_id }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # 개발 서버 배포 (docs/AZURE.md). 저장소 변수 AZURE_DEPLOY=true, AZURE_RESOURCE_GROUP, 시크릿 AZURE_CREDENTIALS
  deploy:
    needs: images
    if: >-
      vars.AZURE_DEPLOY == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'repository_dispatch' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: development
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/azure
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to dev (migrate → api → worker → check, rollback on failure)
        run: |
          REG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}" # 이번 실행이 만든 이미지 (images 작업과 같은 태그)
          bash deploy/azure/ci-deploy.sh -dev toilets-dev.ironhiro.dev \
            "$REG/mashil-api:$TAG" "$REG/mashil-worker:$TAG" "$REG/mashil-migrate:$TAG" "main-${GITHUB_SHA::7}"

  # 운영 배포: 태그 push (docs/RELEASE.md). 개발에 떠 있는 이미지를 그대로 승격한다 — 다시 빌드하지 않는다.
  release:
    if: vars.AZURE_DEPLOY == 'true' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # 승인자를 두고 싶으면 GitHub 의 production 환경에 보호 규칙만 켜면 된다 (지금은 없음 = 태그 push 가 곧 배포)
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write # 릴리스 노트
      packages: write # 이미지에 버전 태그
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          set -euo pipefail
          # 날짜 버전 (CalVer): vYYYY.MM.DD 또는 같은 날 두 번째부터 vYYYY.MM.DD.N
          [[ "$VERSION" =~ ^v20[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.[2-9]|\.[1-9][0-9])?$ ]] \
            || { echo "::error::태그 형식이 아니다: $VERSION (예: v2026.11.17, v2026.11.17.2)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::태그 커밋이 main 에 없다"; exit 1; }

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote what dev is running
        id: promote
        run: |
          set -euo pipefail
          img() { az containerapp show -n "$1" -g "$RG" --query 'properties.template.containers[0].image' -o tsv; }
          DEV_API=$(img mashil-api-dev); DEV_WORKER=$(img mashil-worker-dev)
          DEV_MIGRATE=$(az containerapp job show -n mashil-migrate-dev -g "$RG" --query 'properties.template.containers[0].image' -o tsv)
          # 개발 서버가 실제로 돌리는 커밋 = 이 태그의 커밋이어야 한다 (개발에서 확인한 것만 운영에)
          DEV_SHA=$(curl -fsS https://toilets-dev.ironhiro.dev/healthz/version | jq -r .server)
          [ "$DEV_SHA" = "$GITHUB_SHA" ] || {
            echo "::error::개발 서버는 ${DEV_SHA::7} 을 돌리고 있고 태그는 ${GITHUB_SHA::7} 이다. 개발 배포가 끝난 뒤 태그를 다시 붙인다"
            exit 1; }
          for a in "$DEV_API" "$DEV_WORKER" "$DEV_MIGRATE"; do
            [[ "${a##*:}" == "$GITHUB_SHA"-* ]] || { echo "::error::개발 이미지 커밋이 다르다: ${a##*/}"; exit 1; }
          done
          # 같은 이미지(다이제스트)에 버전 태그를 붙인다. 새 태그라 Container Apps 가 새 리비전을 만든다
          for a in "$DEV_API" "$DEV_WORKER" "$DEV_MIGRATE"; do
            docker buildx imagetools create -t "${a%:*}:$VERSION" "$a"
          done
          # 도보 도로망 임포터: 같은 실행에서 만든 이미지 (ci-deploy.sh 가 Job 이 있으면 쓴다). 없어도 배포는 계속
          OSM="${DEV_MIGRATE%:*}"; OSM="${OSM/mashil-migrate/mashil-osmimport}"
          docker buildx imagetools create -t "$OSM:$VERSION" "$OSM:${DEV_MIGRATE##*:}"             || echo "::warning::osmimport 이미지에 버전 태그를 못 붙였다 (도로망 갱신 Job 만 영향)"
          WEB=$(curl -fsS https://toilets-dev.ironhiro.dev/version.json | jq -r .web)
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "api=${DEV_API%:*}:$VERSION" >> "$GITHUB_OUTPUT"
          echo "worker=${DEV_WORKER%:*}:$VERSION" >> "$GITHUB_OUTPUT"
          echo "migrate=${DEV_MIGRATE%:*}:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy to prod (migrate → api → worker → check, rollback on failure)
        env:
          EXPECT_SHA: ${{ github.sha }}
          EXPECT_WEB: ${{ steps.promote.outputs.web }}
        run: |
          bash deploy/azure/ci-deploy.sh "" toilets.ironhiro.dev \
            "${{ steps.promote.outputs.api }}" "${{ steps.promote.outputs.worker }}" "${{ steps.promote.outputs.migrate }}" "$VERSION"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          WEB: ${{ steps.promote.outputs.web }}
        run: |
          gh release create "$VERSION" --verify-tag --generate-notes \
            --notes "웹: ${{ github.repository_owner }}/Mashil-Front@${WEB::7}" \
            || echo "::warning::릴리스 노트를 만들지 못했다 (배포는 끝남)"
