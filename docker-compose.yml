services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mashil-postgres
    environment:
      POSTGRES_USER: mashil
      POSTGRES_PASSWORD: mashil_dev
      POSTGRES_DB: mashil
    ports:
      - "5432:5432"
    volumes:
      - mashil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashil -d mashil"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mashil_pgdata:
