# 운영용 Compose (08-infrastructure.md §2 출시 단계). 운영 절차는 docs/OPERATIONS.md.
# VM 1대: Caddy(80·443, 웹 정적 + /api 프록시) → api-blue / api-green, worker 1개, postgres(내부 전용, 호스트 포트 없음).
#
#   cp deploy/.env.example /etc/mashil/mashil.env   # 값 채우기, chmod 600 (저장소에 넣지 않는다)
#   docker compose -f deploy/docker-compose.prod.yml --env-file /etc/mashil/mashil.env up -d
#   배포는 deploy/deploy.sh <tag> (마이그레이션 → 블루/그린 하나씩 교체), 롤백은 deploy/rollback.sh

name: mashil

# 컨테이너 로그(json-file)가 디스크를 채우지 않게
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-api: &api
  image: ${MASHIL_IMAGE_API:-mashil-api:latest}
  restart: unless-stopped
  env_file: ${MASHIL_ENV_FILE:-/etc/mashil/mashil.env}
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=mashil;Username=mashil;Password=${POSTGRES_PASSWORD}
    # X-Forwarded-For 는 내부 네트워크(Caddy)에서 온 것만 믿는다 → 빈도 제한이 실제 클라이언트 IP 로 센다
    ForwardedHeaders__KnownNetworks__0: ${MASHIL_DOCKER_SUBNET:-172.30.0.0/24}
  stop_grace_period: 30s          # graceful shutdown (OPS-02)
  depends_on:
    postgres:
      condition: service_healthy
  logging: *logging
  networks: [internal]

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      MASHIL_DOMAIN: ${MASHIL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MASHIL_WEB_ROOT:-/srv/mashil/web}/site:/srv/web:ro          # deploy/web-deploy.sh 가 채움
      - ${MASHIL_STATUS_DIR:-/srv/mashil/status}:/srv/status:ro       # 점검 상태 정적 폴백 (status.json)
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api-blue, api-green]
    logging: *logging
    networks: [internal]

  api-blue:
    <<: *api
  api-green:
    <<: *api

  worker:
    image: ${MASHIL_IMAGE_WORKER:-mashil-worker:latest}
    restart: unless-stopped
    env_file: ${MASHIL_ENV_FILE:-/etc/mashil/mashil.env}
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=mashil;Username=mashil;Password=${POSTGRES_PASSWORD}
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks: [internal]

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: mashil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mashil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashil -d mashil"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    logging: *logging
    networks: [internal]   # ports 없음 — 호스트·외부에 열지 않는다. 관리 작업은 SSH 후 docker compose exec

  # 백업은 호스트 cron 이 deploy/backup.sh 로 (postgres 컨테이너에서 pg_dump, 일간 7 + 주간 4)

  migrate:
    image: ${MASHIL_IMAGE_MIGRATE:-mashil-migrate:latest}
    profiles: [ops]
    environment:
      MASHIL_DB: Host=postgres;Port=5432;Database=mashil;Username=mashil;Password=${POSTGRES_PASSWORD}
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    ipam:
      config:
        - subnet: ${MASHIL_DOCKER_SUBNET:-172.30.0.0/24}
